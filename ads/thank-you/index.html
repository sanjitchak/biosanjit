<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Meet Sanjit Chakrabarti, a Bengali entrepreneur based in Delhi. A little about my life, my family and what I’m looking for in marriage.">
  <meta property="og:title" content="Meet Sanjit Chakrabarti">
  <meta property="og:description" content="A little about my life, my family and what I’m looking for in marriage.">
  <meta property="og:type" content="profile">
  <meta property="og:image" content="https://bio.sanjitchakrabarti.com/photos/sanjit-at-work.jpg">
  <link rel="icon" href="/photos/sanjit-at-work.jpg" type="image/jpeg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
  <title>Thank you | Sanjit Chakrabarti</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fcf8ef;
      --ink: #262a22;
      --muted: #56594b;
      --line: #dcd1bf;
      --green: #294735;
      --rust: #943e29;
      --whatsapp: #25d366;
      --display: "Instrument Serif", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.65 "DM Sans", system-ui, sans-serif; }
    a { color: inherit; text-underline-offset: .24em; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 2px solid var(--rust); outline-offset: 5px; }
    img { display: block; width: 100%; }
    .wrap { width: min(1120px, 100% - 48px); margin-inline: auto; }
    .masthead, nav, .actions, footer { display: flex; align-items: center; flex-wrap: wrap; }
    .masthead { min-height: 76px; justify-content: space-between; gap: 8px 24px; border-bottom: 1px solid var(--line); }
    .brand { font: 1.75rem var(--display); text-decoration: none; }
    nav { gap: 8px 24px; font-size: .875rem; }
    nav a { text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    .hero { display: grid; grid-template-columns: 1.12fr .88fr; align-items: center; gap: clamp(32px, 7vw, 106px); padding-block: clamp(40px, 7vw, 96px); }
    .eyebrow { color: var(--rust); font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1, h2 { font-family: var(--display); font-weight: 400; line-height: .98; margin: 0 0 .25em; }
    h1 { font-size: clamp(3.6rem, 9.4vw, 8.3rem); }
    h1 em { display: block; color: var(--green); }
    h2 { font-size: clamp(2.7rem, 6vw, 4.7rem); }
    .intro { max-width: 37ch; font-size: clamp(1.05rem, 2vw, 1.25rem); }
    .actions { gap: 12px 22px; margin-top: 26px; }
    .button { display: inline-flex; align-items: center; gap: 12px; padding: 12px 19px; border-radius: 5px; background: var(--whatsapp); color: #10291b; font-weight: 700; text-decoration: none; }
    .button:hover { background: #20c45e; }
    .button.download { color: var(--green); background: transparent; border: 1px solid var(--green); }
    .button.download:hover { background: #efe3d1; }
    figure { margin: 0; }
    .hero img { aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 42%; border-radius: 48% 48% 4px 4px / 33% 33% 4px 4px; }
    .facts { margin: 0; padding: 17px 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; border-block: 1px solid var(--line); }
    dt { color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    dd { margin: 2px 0 0; font-weight: 600; }
    .section { padding-block: clamp(40px, 7vw, 88px); }
    .section + .section { border-top: 1px solid var(--line); }
    .story { display: grid; grid-template-columns: .85fr 1.15fr; gap: 20px 65px; }
    .story h3 { margin: 0 0 4px; font-size: 1.05rem; }
    .story p { margin: 0 0 22px; color: var(--muted); max-width: 59ch; }
    .story p:last-child { margin-bottom: 0; }
    .family-photo { width: min(100%, 440px); }
    .family-photo img { height: auto; border-radius: 5px; }
    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(8px, 2vw, 22px); margin-top: 26px; }
    .gallery a { display: block; }
    .gallery img { aspect-ratio: 4 / 5; object-fit: cover; object-position: center 36%; border-radius: 5px; }
    .contact { background: var(--green); color: #fcf8ef; text-align: center; padding: clamp(34px, 7vw, 78px) 22px; border-radius: 6px; }
    .contact p { max-width: 54ch; margin: 16px auto 0; }
    .contact .button { margin-top: 22px; }
    .contact a:focus-visible { outline-color: var(--paper); }
    footer { justify-content: space-between; gap: 10px 24px; padding-block: 24px; color: var(--muted); font-size: .875rem; }
    @media (max-width: 680px) {
      .wrap { width: calc(100% - 36px); }
      .masthead { padding-block: 12px; min-height: 0; }
      nav { gap: 6px 14px; }
      .hero, .story { grid-template-columns: 1fr; }
      .hero { gap: 26px; }
      .hero figure { grid-row: 1; width: min(100%, 285px); margin-inline: auto; }
      .hero img { aspect-ratio: 5 / 5; object-position: 50% 35%; }
      .facts { grid-template-columns: repeat(2, 1fr); }
    }
    #intro-form { padding: clamp(18px, 4vw, 32px); background: #fffdfa; border: 1px solid var(--line); border-radius: 8px; }
    #intro-form label { display: block; font-weight: 600; }
    #intro-form input:not([type=checkbox]), #intro-form textarea { display: block; width: 100%; padding: 10px; border: 1px solid #928672; border-radius: 4px; margin: 5px 0 14px; font: inherit; }
    #intro-form .consent { font-size: .9rem; font-weight: 500; }
    #intro-form p { font-size: .875rem; margin: 10px 0; }
    #intro-form button { border: 0; font: inherit; font-weight: 700; cursor: pointer; }
    #intro-form button:disabled { opacity: .55; cursor: default; }
    .floating { position: fixed; right: 16px; bottom: 16px; z-index: 2; box-shadow: 0 4px 18px #0002; }
    body { padding-bottom: 64px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="wrap masthead"><a class="brand" href="/ads/">Sanjit Chakrabarti</a></header>
  <main class="wrap section">
    <section class="contact" aria-labelledby="thanks">
      <h1 id="thanks" style="font-size:clamp(3rem,8vw,5rem)">Thank you</h1>
      <p id="receipt">You can connect directly with Sanjit on WhatsApp.</p>
      <a class="button" href="https://wa.me/917278135942?text=Hi%20Sanjit%21%20I%20came%20across%20your%20bio%20and%20would%20love%20to%20say%20hello." target="_blank" rel="noopener">Message Sanjit on WhatsApp</a>
    </section>
    <p><a href="/ads/">Back to the bio</a></p>
  </main>
  <script>
    if (sessionStorage.getItem('bio-introduction-received') === 'yes') {
      document.getElementById('receipt').textContent = 'Your introduction was received. If you’d like to say hello directly, you can message Sanjit on WhatsApp.';
      sessionStorage.removeItem('bio-introduction-received');

      // Send one Lead for a confirmed submission, without sharing form fields.
      const pixelId = '1783700199409062';
      const pixel = function (...args) {
        if (pixel.callMethod) {
          pixel.callMethod(...args);
        } else {
          pixel.queue.push(args);
        }
      };
      pixel.queue = [];
      pixel.push = pixel;
      pixel.loaded = true;
      pixel.version = '2.0';
      window.fbq = window._fbq = pixel;
      pixel('set', 'autoConfig', false, pixelId);
      pixel('init', pixelId);
      pixel('trackSingle', pixelId, 'Lead');

      const script = document.createElement('script');
      script.async = true;
      script.src = 'https://connect.facebook.net/en_US/fbevents.js';
      script.referrerPolicy = 'no-referrer';
      document.head.append(script);
    }
  </script>
</body>
</html>
